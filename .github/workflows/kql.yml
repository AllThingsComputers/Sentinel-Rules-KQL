name: KQL Format & Check

on:
  push:
    branches:
      - main
  workflow_dispatch:   # <-- this enables manual run

jobs:
  kql:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Format KQL
        run: node scripts/format-kql.js

      - name: Check KQL
        run: node scripts/check-kql.js

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: auto-format KQL files"
          file_pattern: "**/*.kql"
