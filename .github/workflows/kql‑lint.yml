name: KQL Syntax Check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Normalize KQL files
        shell: bash
        run: |
          find . -name "*.kql" -exec sed -i 's/\r$//' {} \;
          find . -name "*.kql" -exec sed -i 's/[[:space:]]\+$//' {} \;

      - name: Install Kusto PowerShell modules
        shell: pwsh
        run: Install-Module -Name Az.Kusto -Force -Scope CurrentUser

      - name: Parse KQL files
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Recurse -Filter *.kql
          foreach ($f in $files) {
            Write-Host "Checking $($f.FullName)..."
            $content = Get-Content $f.FullName -Raw
            try {
              Add-Type -AssemblyName "Microsoft.Azure.Kusto.Language"
              [Microsoft.Azure.Kusto.Language.KustoCode]::Parse($content) | Out-Null
            }
            catch {
              Write-Host "❌ Syntax error in $($f.FullName)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 } else { Write-Host "✅ All KQL files passed." }
