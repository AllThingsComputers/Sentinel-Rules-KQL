name: KQL Syntax Check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Kusto Language
        shell: pwsh
        run: Install-Module -Name Az.Kusto -Force -Scope CurrentUser

      - name: Parse all KQL files and show errors
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Recurse -Filter *.kql
          foreach ($f in $files) {
              Write-Host "Checking $($f.FullName)..."
              $content = Get-Content $f.FullName -Raw
              try {
                  Add-Type -AssemblyName "Microsoft.Azure.Kusto.Language"
                  [Microsoft.Azure.Kusto.Language.KustoCode]::Parse($content) | Out-Null
              } catch {
                  Write-Host "❌ Syntax error in $($f.FullName)"
                  Write-Host $_.Exception.Message
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Host "❌ One or more KQL files have syntax errors."
              exit 1
          } else {
              Write-Host "✅ All KQL files passed."
          }
