name: KQL Check

# Run on push to main, pull requests, or manually
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  kql-check:
    runs-on: ubuntu-latest

    steps:
      # Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # or 20 if you prefer

      # Install dependencies if needed (not required for our checker)
      # - name: Install dependencies
      #   run: npm install

      # Run KQL human-readable checker
      - name: Run KQL Checker
        run: node scripts/check-kql-human.js
